name: dear_stranger
description: Dear Stranger — A letter-and-art exchange.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^15.0.0
  provider: ^6.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
